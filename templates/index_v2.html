<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Keep Clone</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans dark-mode-transition min-h-screen">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 py-3 px-6 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4 sticky top-0 z-40">
    <div class="flex items-center space-x-3 w-full sm:w-auto justify-between">
      <h1 class="text-2xl font-semibold text-amber-600 dark:text-amber-500 tracking-tight">Keep V2</h1>
      <button id="theme-toggle" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-sm">
        🌙
      </button>
    </div>
    <div class="w-full sm:w-96">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search notes..." 
        class="w-full px-4 py-2 bg-gray-100 dark:bg-gray-700 border border-transparent dark:text-gray-100 rounded-lg focus:bg-white dark:focus:bg-gray-800 focus:border-gray-300 dark:focus:border-gray-600 focus:outline-none text-sm transition"
      >
    </div>
  </header>

  <main class="max-w-4xl mx-auto mt-8 px-4 pb-12">
    <!-- Input Form -->
    <form id="note-form" class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg shadow-md p-4 mb-8 relative max-w-xl mx-auto">
      <input type="text" id="note-title" placeholder="Title" class="w-full px-2 py-1 mb-2 font-semibold text-gray-800 dark:text-gray-100 bg-transparent focus:outline-none hidden">
      <textarea id="note-content" placeholder="Take a note..." rows="1" class="w-full px-2 py-1 resize-none focus:outline-none text-sm text-gray-700 dark:text-gray-200 bg-transparent"></textarea>
      
      <div id="form-controls" class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100 dark:border-gray-700 hidden">
        <div class="flex items-center space-x-2">
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-white dark:bg-gray-800" checked class="hidden peer"><span class="block w-5 h-5 rounded-full border border-gray-300 bg-white dark:bg-gray-800 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-yellow-100 dark:bg-yellow-900/40" class="hidden peer"><span class="block w-5 h-5 rounded-full bg-yellow-100 dark:bg-yellow-800 border border-yellow-200 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-green-100 dark:bg-green-900/40" class="hidden peer"><span class="block w-5 h-5 rounded-full bg-green-100 dark:bg-green-800 border border-green-200 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-blue-100 dark:bg-blue-900/40" class="hidden peer"><span class="block w-5 h-5 rounded-full bg-blue-100 dark:bg-blue-800 border border-blue-200 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-pink-100 dark:bg-pink-900/40" class="hidden peer"><span class="block w-5 h-5 rounded-full bg-pink-100 dark:bg-pink-800 border border-pink-200 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
        </div>
        <button type="submit" class="bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 px-4 py-1.5 rounded-md text-sm font-medium hover:bg-gray-800 dark:hover:bg-gray-200 transition">Done</button>
      </div>
    </form>

    <!-- Notes Container -->
    <div id="notes-container" class="space-y-6">
      <div id="pinned-section" class="hidden">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Pinned</h2>
        <div id="pinned-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
      </div>

      <div id="others-section">
        <h2 id="others-header" class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 hidden">Others</h2>
        <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
      </div>
    </div>
  </main>

  <!-- Edit Note Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl max-w-lg w-full p-6 relative border dark:border-gray-700">
      <h3 class="text-lg font-bold mb-4 text-gray-800 dark:text-gray-100">Edit Note</h3>
      <input type="text" id="edit-title" placeholder="Title" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md mb-3 font-medium focus:outline-none focus:ring-2 focus:ring-amber-500">
      <textarea id="edit-content" placeholder="Content" rows="4" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md mb-4 resize-none focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
      <div class="flex justify-end space-x-2">
        <button id="close-modal" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition">Cancel</button>
        <button id="save-edit" class="px-4 py-2 text-sm bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 hover:bg-gray-800 dark:hover:bg-gray-200 rounded-md transition">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const noteForm = document.getElementById('note-form');
    const noteTitleInput = document.getElementById('note-title');
    const noteContentInput = document.getElementById('note-content');
    const formControls = document.getElementById('form-controls');
    
    const pinnedSection = document.getElementById('pinned-section');
    const pinnedGrid = document.getElementById('pinned-grid');
    const othersHeader = document.getElementById('others-header');
    const notesGrid = document.getElementById('notes-grid');
    
    const searchInput = document.getElementById('search-input');
    const editModal = document.getElementById('edit-modal');
    const editTitleInput = document.getElementById('edit-title');
    const editContentInput = document.getElementById('edit-content');
    const closeModalBtn = document.getElementById('close-modal');
    const saveEditBtn = document.getElementById('save-edit');

    let currentEditId = null;
    let notes = [];

    // Dark Mode Toggle
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      themeToggle.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    });

    // Toast Notification
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-gray-900 text-white text-xs px-4 py-2 rounded-md shadow-lg transition-opacity duration-300 opacity-0';
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    noteContentInput.addEventListener('focus', () => {
      noteTitleInput.classList.remove('hidden');
      formControls.classList.remove('hidden');
      noteContentInput.rows = 3;
    });

    document.addEventListener('click', (e) => {
      if (!noteForm.contains(e.target) && !noteTitleInput.value && !noteContentInput.value) {
        noteTitleInput.classList.add('hidden');
        formControls.classList.add('hidden');
        noteContentInput.rows = 1;
      }
    });

    async function fetchNotes() {
      try {
        const response = await fetch('/api/notes');
        notes = await response.json();
        renderNotes(searchInput.value);
      } catch (err) {
        showToast('Error loading notes from server');
      }
    }

    function createNoteCard(note) {
      const cardBg = note.color || 'bg-white dark:bg-gray-800';
      const card = document.createElement('div');
      card.className = `note-card ${cardBg} border border-gray-200 dark:border-gray-700 rounded-lg p-4 shadow-sm hover:shadow-md transition relative group flex flex-col justify-between cursor-pointer`;
      
      card.innerHTML = `
        <div onclick="openEditModal(${note.id})">
          ${note.title ? `<h3 class="font-bold text-gray-900 dark:text-gray-100 mb-1 pr-6 text-sm">${escapeHtml(note.title)}</h3>` : ''}
          <p class="text-gray-700 dark:text-gray-300 whitespace-pre-wrap text-sm leading-relaxed">${escapeHtml(note.content)}</p>
        </div>
        <div class="flex items-center justify-between mt-4 pt-2 border-t border-black/5 dark:border-white/5">
          <button onclick="togglePin(${note.id}, event)" class="text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-amber-600 dark:hover:text-amber-500 transition" title="${note.pinned ? 'Unpin' : 'Pin'}">
            ${note.pinned ? '📌 Unpin' : '📍 Pin'}
          </button>
          <button onclick="deleteNote(${note.id}, event)" class="opacity-0 group-hover:opacity-100 transition p-1 text-gray-500 hover:text-red-600 rounded-full" title="Delete">
            🗑️
          </button>
        </div>
      `;
      return card;
    }

    function renderNotes(filterText = '') {
      pinnedGrid.innerHTML = '';
      notesGrid.innerHTML = '';

      const filteredNotes = notes.filter(note => 
        note.title.toLowerCase().includes(filterText.toLowerCase()) || 
        note.content.toLowerCase().includes(filterText.toLowerCase())
      );

      if (filteredNotes.length === 0) {
        pinnedSection.classList.add('hidden');
        othersHeader.classList.add('hidden');
        notesGrid.innerHTML = `<p class="text-gray-400 dark:text-gray-500 col-span-full text-center py-10">No matching notes found.</p>`;
        return;
      }

      const pinnedNotes = filteredNotes.filter(n => n.pinned);
      const otherNotes = filteredNotes.filter(n => !n.pinned);

      if (pinnedNotes.length > 0) {
        pinnedSection.classList.remove('hidden');
        pinnedNotes.forEach(note => pinnedGrid.appendChild(createNoteCard(note)));
      } else {
        pinnedSection.classList.add('hidden');
      }

      if (otherNotes.length > 0) {
        otherNotes.forEach(note => notesGrid.appendChild(createNoteCard(note)));
        othersHeader.classList.toggle('hidden', pinnedNotes.length === 0);
      } else {
        othersHeader.classList.add('hidden');
      }
    }

    noteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = noteTitleInput.value.trim();
      const content = noteContentInput.value.trim();
      const selectedColorInput = document.querySelector('input[name="note-color"]:checked');
      const selectedColor = selectedColorInput ? selectedColorInput.value : 'bg-white dark:bg-gray-800';

      if (!title && !content) return;

      try {
        await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, color: selectedColor, pinned: false })
        });
        showToast('Note created');
        await fetchNotes();

        noteTitleInput.value = '';
        noteContentInput.value = '';
        noteTitleInput.classList.add('hidden');
        formControls.classList.add('hidden');
        noteContentInput.rows = 1;
      } catch (err) {
        showToast('Failed to create note');
      }
    });

    async function togglePin(id, e) {
      e.stopPropagation();
      const note = notes.find(n => n.id === id);
      if (!note) return;

      try {
        await fetch(`/api/notes/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pinned: !note.pinned })
        });
        showToast(note.pinned ? 'Note unpinned' : 'Note pinned');
        await fetchNotes();
      } catch (err) {
        showToast('Failed to update note');
      }
    }

    async function deleteNote(id, e) {
      e.stopPropagation();
      try {
        await fetch(`/api/notes/${id}`, { method: 'DELETE' });
        showToast('Note deleted');
        await fetchNotes();
      } catch (err) {
        showToast('Failed to delete note');
      }
    }

    function openEditModal(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      currentEditId = id;
      editTitleInput.value = note.title;
      editContentInput.value = note.content;
      editModal.classList.remove('hidden');
      editModal.classList.add('flex');
    }

    closeModalBtn.addEventListener('click', () => {
      editModal.classList.add('hidden');
      editModal.classList.remove('flex');
    });

    saveEditBtn.addEventListener('click', async () => {
      if (currentEditId === null) return;

      try {
        await fetch(`/api/notes/${currentEditId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: editTitleInput.value.trim(),
            content: editContentInput.value.trim()
          })
        });
        showToast('Note updated');
        await fetchNotes();
        editModal.classList.add('hidden');
        editModal.classList.remove('flex');
      } catch (err) {
        showToast('Failed to update note');
      }
    });

    searchInput.addEventListener('input', (e) => renderNotes(e.target.value));

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    fetchNotes();
  </script>
</body>
</html>
