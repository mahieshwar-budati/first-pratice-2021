<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Keep Clone</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

  <!-- Header with Search Bar -->
  <header class="bg-white border-b border-gray-200 py-3 px-6 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4 sticky top-0 z-40">
    <div class="flex items-center space-x-3">
      <h1 class="text-2xl font-semibold text-amber-600 tracking-tight">Keep</h1>
    </div>
    <div class="w-full sm:w-96">
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search notes..." 
        class="w-full px-4 py-2 bg-gray-100 border border-transparent rounded-lg focus:bg-white focus:border-gray-300 focus:outline-none text-sm transition"
      >
    </div>
  </header>

  <main class="max-w-4xl mx-auto mt-8 px-4 pb-12">
    <!-- Input Form -->
    <form id="note-form" class="bg-white border border-gray-300 rounded-lg shadow-md p-4 mb-8 transition-all relative max-w-xl mx-auto">
      <input type="text" id="note-title" placeholder="Title" class="w-full px-2 py-1 mb-2 font-semibold text-gray-800 focus:outline-none hidden">
      <textarea id="note-content" placeholder="Take a note..." rows="1" class="w-full px-2 py-1 resize-none focus:outline-none text-sm text-gray-700"></textarea>
      
      <!-- Form Controls (Color Picker & Done Button) -->
      <div id="form-controls" class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100 hidden">
        <!-- Color Options -->
        <div class="flex items-center space-x-2">
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-white" checked class="hidden peer"><span class="block w-5 h-5 rounded-full border border-gray-300 bg-white peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-yellow-100" class="hidden peer"><span class="block w-5 h-5 rounded-full bg-yellow-100 border border-yellow-200 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-green-100" class="hidden peer"><span class="block w-5 h-5 rounded-full bg-green-100 border border-green-200 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-blue-100" class="hidden peer"><span class="block w-5 h-5 rounded-full bg-blue-100 border border-blue-200 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
          <label class="cursor-pointer"><input type="radio" name="note-color" value="bg-pink-100" class="hidden peer"><span class="block w-5 h-5 rounded-full bg-pink-100 border border-pink-200 peer-checked:ring-2 peer-checked:ring-amber-500"></span></label>
        </div>
        <button type="submit" class="bg-gray-900 text-white px-4 py-1.5 rounded-md text-sm font-medium hover:bg-gray-800 transition">Done</button>
      </div>
    </form>

    <!-- Notes Container -->
    <div id="notes-container" class="space-y-6">
      <!-- Pinned Notes Section -->
      <div id="pinned-section" class="hidden">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Pinned</h2>
        <div id="pinned-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
      </div>

      <!-- Other Notes Section -->
      <div id="others-section">
        <h2 id="others-header" class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 hidden">Others</h2>
        <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
      </div>
    </div>
  </main>

  <!-- Edit Note Modal -->
  <div id="edit-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 relative" id="modal-box">
      <h3 class="text-lg font-bold mb-4 text-gray-800">Edit Note</h3>
      <input type="text" id="edit-title" placeholder="Title" class="w-full px-3 py-2 border border-gray-300 rounded-md mb-3 font-medium focus:outline-none focus:ring-2 focus:ring-amber-500">
      <textarea id="edit-content" placeholder="Content" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md mb-4 resize-none focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
      <div class="flex justify-end space-x-2">
        <button id="close-modal" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-md transition">Cancel</button>
        <button id="save-edit" class="px-4 py-2 text-sm bg-gray-900 text-white hover:bg-gray-800 rounded-md transition">Save</button>
      </div>
    </div>
  </div>

  <script>
    const noteForm = document.getElementById('note-form');
    const noteTitleInput = document.getElementById('note-title');
    const noteContentInput = document.getElementById('note-content');
    const formControls = document.getElementById('form-controls');
    
    const pinnedSection = document.getElementById('pinned-section');
    const pinnedGrid = document.getElementById('pinned-grid');
    const othersHeader = document.getElementById('others-header');
    const notesGrid = document.getElementById('notes-grid');
    
    const searchInput = document.getElementById('search-input');
    const editModal = document.getElementById('edit-modal');
    const editTitleInput = document.getElementById('edit-title');
    const editContentInput = document.getElementById('edit-content');
    const closeModalBtn = document.getElementById('close-modal');
    const saveEditBtn = document.getElementById('save-edit');

    let currentEditId = null;
    let notes = [];

    // Expand form on focus
    noteContentInput.addEventListener('focus', () => {
      noteTitleInput.classList.remove('hidden');
      formControls.classList.remove('hidden');
      noteContentInput.rows = 3;
    });

    // Collapse form when clicking outside
    document.addEventListener('click', (e) => {
      if (!noteForm.contains(e.target) && !noteTitleInput.value && !noteContentInput.value) {
        noteTitleInput.classList.add('hidden');
        formControls.classList.add('hidden');
        noteContentInput.rows = 1;
      }
    });

    // Fetch notes from Flask API
    async function fetchNotes() {
      try {
        const response = await fetch('/api/notes');
        notes = await response.json();
        renderNotes(searchInput.value);
      } catch (err) {
        console.error('Error loading notes:', err);
      }
    }

    // Helper to render individual card elements
    function createNoteCard(note) {
      const cardBg = note.color || 'bg-white';
      const card = document.createElement('div');
      card.className = `${cardBg} border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow-md transition relative group flex flex-col justify-between cursor-pointer`;
      
      card.innerHTML = `
        <div onclick="openEditModal(${note.id})">
          ${note.title ? `<h3 class="font-bold text-gray-900 mb-1 pr-6 text-sm">${escapeHtml(note.title)}</h3>` : ''}
          <p class="text-gray-700 whitespace-pre-wrap text-sm leading-relaxed">${escapeHtml(note.content)}</p>
        </div>
        <div class="flex items-center justify-between mt-4 pt-2 border-t border-black/5">
          <button onclick="togglePin(${note.id}, event)" class="text-xs font-medium text-gray-500 hover:text-amber-600 transition" title="${note.pinned ? 'Unpin' : 'Pin'}">
            ${note.pinned ? '📌 Unpin' : '📍 Pin'}
          </button>
          <button onclick="deleteNote(${note.id}, event)" class="opacity-0 group-hover:opacity-100 transition p-1 text-gray-500 hover:text-red-600 rounded-full" title="Delete">
            🗑️
          </button>
        </div>
      `;
      return card;
    }

    // Render Notes with filter support
    function renderNotes(filterText = '') {
      pinnedGrid.innerHTML = '';
      notesGrid.innerHTML = '';

      const filteredNotes = notes.filter(note => 
        note.title.toLowerCase().includes(filterText.toLowerCase()) || 
        note.content.toLowerCase().includes(filterText.toLowerCase())
      );

      if (filteredNotes.length === 0) {
        pinnedSection.classList.add('hidden');
        othersHeader.classList.add('hidden');
        notesGrid.innerHTML = `<p class="text-gray-400 col-span-full text-center py-10">No matching notes found.</p>`;
        return;
      }

      const pinnedNotes = filteredNotes.filter(n => n.pinned);
      const otherNotes = filteredNotes.filter(n => !n.pinned);

      // Render Pinned Notes
      if (pinnedNotes.length > 0) {
        pinnedSection.classList.remove('hidden');
        pinnedNotes.forEach(note => pinnedGrid.appendChild(createNoteCard(note)));
      } else {
        pinnedSection.classList.add('hidden');
      }

      // Render Other Notes
      if (otherNotes.length > 0) {
        otherNotes.forEach(note => notesGrid.appendChild(createNoteCard(note)));
        othersHeader.classList.toggle('hidden', pinnedNotes.length === 0);
      } else {
        othersHeader.classList.add('hidden');
      }
    }

    // Handle Note Creation
    noteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = noteTitleInput.value.trim();
      const content = noteContentInput.value.trim();
      const selectedColorInput = document.querySelector('input[name="note-color"]:checked');
      const selectedColor = selectedColorInput ? selectedColorInput.value : 'bg-white';

      if (!title && !content) return;

      try {
        await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: Date.now(), title, content, color: selectedColor, pinned: false })
        });
        await fetchNotes();

        // Reset form
        noteTitleInput.value = '';
        noteContentInput.value = '';
        noteTitleInput.classList.add('hidden');
        formControls.classList.add('hidden');
        noteContentInput.rows = 1;
      } catch (err) {
        console.error('Error creating note:', err);
      }
    });

    // Pin Toggle
    async function togglePin(id, e) {
      e.stopPropagation();
      const note = notes.find(n => n.id === id);
      if (!note) return;

      try {
        await fetch(`/api/notes/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pinned: !note.pinned })
        });
        await fetchNotes();
      } catch (err) {
        console.error('Error toggling pin:', err);
      }
    }

    // Delete Note
    async function deleteNote(id, e) {
      e.stopPropagation();
      try {
        await fetch(`/api/notes/${id}`, { method: 'DELETE' });
        await fetchNotes();
      } catch (err) {
        console.error('Error deleting note:', err);
      }
    }

    // Edit Modal handlers
    function openEditModal(id) {
      const note = notes.find(n => n.id === id);
      if (!note) return;
      currentEditId = id;
      editTitleInput.value = note.title;
      editContentInput.value = note.content;
      editModal.classList.remove('hidden');
      editModal.classList.add('flex');
    }

    closeModalBtn.addEventListener('click', () => {
      editModal.classList.add('hidden');
      editModal.classList.remove('flex');
    });

    saveEditBtn.addEventListener('click', async () => {
      if (currentEditId === null) return;

      try {
        await fetch(`/api/notes/${currentEditId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: editTitleInput.value.trim(),
            content: editContentInput.value.trim()
          })
        });
        await fetchNotes();
        editModal.classList.add('hidden');
        editModal.classList.remove('flex');
      } catch (err) {
        console.error('Error updating note:', err);
      }
    });

    // Search filter listener
    searchInput.addEventListener('input', (e) => {
      renderNotes(e.target.value);
    });

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial load from backend API
    fetchNotes();
  </script>
</body>
</html>
